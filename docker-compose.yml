services:
  backend:
    build:
      context: ./backend
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      HOST: 0.0.0.0
      PORT: 8000
      HARVEST_ROOT: /data/harvested_kernels
      KAGGLE_API_TOKEN: ${KAGGLE_API_TOKEN:-}
      KAGGLE_COMPETITION: ${KAGGLE_COMPETITION:-rogii-wellbore-geology-prediction}
      HARVESTER_API_KEY: ${HARVESTER_API_KEY:-}
      HARVESTER_ALLOWED_ORIGINS: ${HARVESTER_ALLOWED_ORIGINS:-http://127.0.0.1:8080}
      HARVESTER_MIN_FREE_BYTES: ${HARVESTER_MIN_FREE_BYTES:-2147483648}
      HARVESTER_ALLOW_OPEN_FOLDER: "false"
      HARVESTER_NOTIFICATION_WEBHOOK_URL: ${HARVESTER_NOTIFICATION_WEBHOOK_URL:-}
      HARVESTER_NOTIFICATION_SMTP_PASSWORD: ${HARVESTER_NOTIFICATION_SMTP_PASSWORD:-}
      OPENCLAW_GATEWAY_URL: ${OPENCLAW_GATEWAY_URL:-http://host.docker.internal:18789}
      OPENCLAW_LLM_API_KEY: ${OPENCLAW_LLM_API_KEY:-}
      OPENCLAW_LLM_BASE_URL: ${OPENCLAW_LLM_BASE_URL:-https://tokenrhythm.studio/v1}
      OPENCLAW_LLM_MODEL: ${OPENCLAW_LLM_MODEL:-deepseek-v4-flash-0731}
      OPENCLAW_CONFIG_PATH: ${OPENCLAW_CONFIG_PATH:-}
    volumes:
      - ./harvested_kernels:/data/harvested_kernels
    expose:
      - "8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import os, urllib.request;
          req=urllib.request.Request('http://127.0.0.1:8000/api/health', headers={'X-Harvester-Key': os.environ.get('HARVESTER_API_KEY','')});
          urllib.request.urlopen(req, timeout=5)
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${APP_BIND_ADDRESS:-127.0.0.1}:${APP_PORT:-8080}:80"
